{% extends 'base.html' %}

{% block title %}パスワード変更完了 - PortfolioPages{% endblock %}

{% block extra_css %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'home/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-message success-message">
        <h1 class="auth-title">パスワード変更完了</h1>
        
        <div class="success-content">
            <div class="success-icon">✅</div>
            <p class="message-text">
                パスワードが正常に変更されました。
            </p>
            <p class="message-detail">
                新しいパスワードでログインしてください。
            </p>
        </div>

        <div class="auth-actions">
            <a href="{% url 'home:home' %}" class="button button-primary">
                ホームに戻る
            </a>
        </div>
    </div>
</div>
{% endblock %}
