<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>新しいパスワードの設定</title></head>
<body>
  <h1>新しいパスワードの設定（プレースホルダー）</h1>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">設定する</button>
  </form>
  {% else %}
  <p>このリンクは無効か、有効期限が切れています。</p>
  {% endif %}
</body>
</html>
