<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>ログイン</title></head>
<body>
  <h1>ログイン（プレースホルダー）</h1>
  {% if form.errors %}<p style="color:red;">ユーザー名またはパスワードが正しくありません。</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ログイン</button>
  </form>
  <p><a href="{% url 'accounts:password_reset' %}">パスワードを忘れた場合</a></p>
</body>
</html>
